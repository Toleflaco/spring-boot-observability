apiVersion: 1

# Borra las data sources creadas a mano en M1 (mismos nombres)
deleteDatasources:
  - name: loki
    orgId: 1
  - name: prometheus
    orgId: 1

datasources:
  - name: loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false

  - name: prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
